aid: decorte-future-industries
name: Decorte Future Industries
description: >-
  Decorte Future Industries (DFI) is a UK healthtech company building AI that
  extracts clinical health signals from sound. Its technology turns the
  microphone in an ordinary smartphone into a screening device, analyzing audio
  to detect signs of heart, breathing, brain, and gut conditions at a standard
  targeting in-clinic specialist examinations. DFI's first commercial product,
  Sonus Health, is a veterinary heart-screening platform: clinics and pet owners
  record 30 seconds of heart sound from dogs (cats and horses coming soon) with a
  phone, and AI returns heart rate, heart rate variability, murmur detection, and
  a composite Heart Health Score in seconds, with a full report reviewed by a
  board-certified veterinary cardiologist within 48 hours. Sonus Health ships as
  iOS and Android apps for pet owners and a web dashboard for veterinary clinics.
